<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 视口配置强化：新增initial-scale=1.0固定，禁止所有缩放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Safari键盘终极适配（零间隙+无外层滚动）</title>
</head>
<style>
  /* ********** 全局样式：彻底屏蔽所有原生滚动/偏移 ********** */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  /* 禁止选中文本，防止触摸触发意外行为 */
  -webkit-user-select: none;
  user-select: none;
}
/* 屏蔽Safari所有原生弹性滚动/溢出滚动 */
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden !important;
  /* 禁止浏览器默认触摸/滚动行为，核心！ */
  touch-action: none !important;
  /* 屏蔽弹性滚动（overscroll），杜绝外层滚动 */
  overscroll-behavior: none !important;
  -webkit-overflow-scrolling: auto !important; /* 关闭Safari弹性滚动，避免偏移 */
}

/* ********** 页面唯一容器：绝对定位占满视口，弹性纵向布局 ********** */
.page-wrapper {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 50px;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column; /* 内容区上，输入框下，纵向排列 */
  background: #f5f5f5;
  /* 硬件加速，防止Safari渲染偏移 */
  /* transform: translateZ(0);
  -webkit-transform: translateZ(0); */
}

/* ********** 内容区：自适应剩余高度，仅这里能滚动 ********** */
.page-content {
  flex: 1; /* 占满输入框以外的所有高度，核心！ */
  overflow-y: auto;
  /* 仅开启内容区的Safari弹性滚动，不影响外层 */
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  /* 内容区滚动不触发外层任何行为 */
  overscroll-behavior: contain;
}
/* 内容区文字恢复可选 */
.page-content * {
  -webkit-user-select: text;
  user-select: text;
}

/* ********** 输入框容器：固定高度，无任何定位偏移 ********** */
.input-bar {
  width: 100%;
  height: 50px; /* 固定输入框高度，按需修改 */
  padding: 0 16px;
  background: #f00;
  border-top: 1px solid #e5e5e5;
  display: flex;
  align-items: center;
  /* 硬件加速，消除渲染间隙 */
  /* transform: translateZ(0);
  -webkit-transform: translateZ(0); */
}
/* 输入框样式 */
.input {
  flex: 1;
  height: 36px;
  border: 1px solid #e5e5e5;
  border-radius: 18px;
  padding: 0 16px;
  outline: none;
  font-size: 14px;
  /* 禁止输入框的默认缩放 */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
input[type="text"]::-webkit-textfield-decoration-container {
  /* padding: 0; */
  display: none;
}
input[type="text"] {
  -webkit-appearance: none;
  appearance: none;
}

/* ********** 兼容iPhone底部小黑条（安全区），可选 ********** */
@supports (padding-bottom: constant(safe-area-inset-bottom)) or (padding-bottom: env(safe-area-inset-bottom)) {
  .input-bar {
    padding-bottom: constant(safe-area-inset-bottom);
    padding-bottom: env(safe-area-inset-bottom);
    height: calc(50px + constant(safe-area-inset-bottom));
    height: calc(50px + env(safe-area-inset-bottom));
  }
}
</style>
<body>
  <!-- 唯一页面容器：包裹所有内容，绝对定位占满视口 -->
  <div class="page-wrapper">
    <!-- 内容区：单独滚动，所有页面内容放这里 -->
    <div class="page-content">
      <!-- 测试长内容，验证滚动 -->
      <div style="line-height: 2; font-size: 16px; padding: 0 16px;">
        测试内容1<br>测试内容<br>测试内容<br>测试内容<br>测试内容<br>
        测试内容<br>测试内容<br>测试内容<br>测试内容<br>测试内容<br>
        测试内容<br>测试内容<br>测试内容<br>测试内容<br>测试内容<br>
        测试内容<br>测试内容<br>测试内容<br>测试内容<br>测试内容<br>
        测试内容<br>测试内容<br>测试内容<br>测试内容<br>测试内容<br>
        测试内容<br>测试内容<br>测试内容<br>测试内容<br>测试内容<br>
        测试内容<br>测试内容<br>测试内容<br>测试内容<br>测试内容<br>
        测试内容<br>测试内容<br>测试内容<br>测试内容<br>测试内容111<br>
      </div>
    </div>
    <!-- 输入框容器：固定在页面底部，无任何偏移 -->
    <div class="input-bar">
      <input type="text" placeholder="请输入内容..." class="input">
    </div>
  </div>

  <script>
    // ********** 获取核心DOM **********
const pageWrapper = document.querySelector('.page-wrapper');
const pageContent = document.querySelector('.page-content');
const inputBar = document.querySelector('.input-bar');
const input = document.querySelector('.input');
// 初始化视口高度（键盘收起时的原始高度）
let originalViewHeight = window.innerHeight;
// 标记键盘是否弹起
let isKeyboardShow = false;

// ********** 核心方法：键盘弹起时的精准适配（零间隙关键） **********
function handleKeyboardShow() {
  if (isKeyboardShow) return; // 防止重复触发
  isKeyboardShow = true;

  // 延迟100ms：等待键盘完全弹起，保证视口高度计算精准（Safari键盘弹起有延迟）
  setTimeout(() => {
    // 1. 计算真实键盘高度 = 原始视口高度 - 键盘弹起后的视口高度
    const currentViewHeight = window.innerHeight;
    const keyboardHeight = originalViewHeight - currentViewHeight;
    if (keyboardHeight <= 0) return; // 过滤非键盘触发的视口变化

    // 2. 动态调整页面容器底部边距 = 键盘高度，让输入框紧贴键盘（零间隙核心！）
    pageWrapper.style.paddingBottom = `${keyboardHeight}px`;

    // 3. 强制视口归位：禁止浏览器自动上移页面，输入框始终在可视区底部
    window.scrollTo(0, 0);
    document.body.scrollTop = 0;
  }, 100);
}

// ********** 核心方法：键盘收起时的恢复 **********
function handleKeyboardHide() {
  if (!isKeyboardShow) return;
  isKeyboardShow = false;

  // 1. 恢复页面容器样式，移除底部边距
  pageWrapper.style.paddingBottom = '0px';
  // 2. 恢复原始视口高度（适配窗口大小变化）
  originalViewHeight = window.innerHeight;
  // 3. 强制视口归位
  window.scrollTo(0, 0);
  document.body.scrollTop = 0;
}

// ********** 监听事件：100%触发，替代resize，无遗漏 **********
// 1. 输入框聚焦 → 键盘弹起
input.addEventListener('focus', handleKeyboardShow);
// 2. 输入框失焦 → 键盘收起
input.addEventListener('blur', handleKeyboardHide);
// 3. 点击页面空白处 → 收起键盘（解决点击空白处无blur的情况）
document.addEventListener('click', (e) => {
  if (e.target !== input && !inputBar.contains(e.target)) {
    input.blur(); // 主动失焦
    handleKeyboardHide();
  }
});
// 4. 屏蔽所有触摸/滚动的默认行为，杜绝外层滚动（终极保险）
document.addEventListener('touchmove', (e) => {
  // 仅当键盘弹起时屏蔽，避免影响内容区正常滚动
  if (isKeyboardShow) {
    // e.preventDefault();
    // e.stopPropagation();
  }
}, { passive: false }); // passive: false 必须加，否则preventDefault失效！
// 5. 兼容部分会触发resize的浏览器，双重保险
window.addEventListener('resize', () => {
  if (window.innerHeight < originalViewHeight - 50) {
    handleKeyboardShow();
  } else {
    handleKeyboardHide();
  }
});

// ********** 初始化：防止页面加载时的视口偏移 **********
window.addEventListener('load', () => {
  originalViewHeight = window.innerHeight;
  window.scrollTo(0, 0);
  document.body.scrollTop = 0;
});
  </script>
</body>
</html>
